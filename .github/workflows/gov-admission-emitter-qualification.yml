name: GOV-ADMISSION-04 — qualificazione sintetica emittente
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: gov-admission-emitter-qualification
  cancel-in-progress: false
jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify context, source integrity and synthetic regressions (no publication)
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = antoniocorsano-boop/registro-docente-governance
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_WORKFLOW_REF" = antoniocorsano-boop/registro-docente-governance/.github/workflows/gov-admission-emitter-qualification.yml@refs/heads/main
          umask 077
          mkdir "$RUNNER_TEMP/gov-admission-04-qualification"
          cd "$RUNNER_TEMP/gov-admission-04-qualification"
          cat > verify_remote.py <<'GOV_END_04_0'
