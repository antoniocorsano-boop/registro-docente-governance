name: GOV-ADMISSION-07 — independent exact-candidate admission
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Synthetic qualification or approved live emission
        required: true
        type: choice
        default: synthetic
        options:
          - synthetic
          - live
permissions: {}
concurrency:
  group: gov-admission-07
  cancel-in-progress: false
jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - &prepare_sources
        name: Verify protected context and pinned sources (no secrets)
        shell: bash
        env:
          GOV_REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = antoniocorsano-boop/registro-docente-governance
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REF_PROTECTED" = true
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_ACTOR_ID" = 233439245
          test "$GITHUB_TRIGGERING_ACTOR" = antoniocorsano-boop
          test "$GITHUB_WORKFLOW_REF" = antoniocorsano-boop/registro-docente-governance/.github/workflows/gov-admission-emit.yml@refs/heads/main
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          case "$GOV_REQUESTED_MODE" in synthetic|live) ;; *) exit 1 ;; esac
          umask 077
          mkdir "$RUNNER_TEMP/gov-admission-07"
          cd "$RUNNER_TEMP/gov-admission-07"
          cat > verify_remote.py <<'GOV07_END_0'
